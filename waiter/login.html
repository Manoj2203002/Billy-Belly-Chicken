<!doctype html>
<html lang="en" data-title-key="waiter-login.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waiter login | Billy Belly Chicken</title>
  <meta name="description" content="Staff sign in">
  <meta name="theme-color" content="#0a0909">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/logo/favicon.ico"><link rel="apple-touch-icon" href="../assets/logo/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/bundles/waiter-login.css" data-src="fonts,variables,base,components,portal,pages/waiter-login">
  <link rel="preload" href="../assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="../js/bundles/data.js"></script><script defer src="../js/bundles/waiter-login.js"></script>
</head>
<body data-root="../" data-page="login">

<main class="auth" id="app">
  <aside class="auth__art dark" aria-hidden="true"><div class="wl-art"><img src="../assets/logo/logo-320.webp" alt=""><p class="display" data-i18n="waiter-login.art">Serve fast. Smile more.</p></div></aside>
  <section class="auth__panel"><form class="auth__card" id="form" novalidate>
    <a href="../index.html" class="wl-back" data-i18n-aria="common.back" aria-label="Back"></a>
    <div><h1 class="display" data-i18n="waiter-login.h">Welcome back</h1><p class="text-muted" data-i18n="waiter-login.sub">Sign in to manage your tables.</p></div>
    <div class="field"><label for="u" data-i18n="waiter-login.user">Username</label><input class="input" id="u" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label for="p" data-i18n="waiter-login.pass">Password</label><div class="wl-pw"><input class="input" id="p" type="password" autocomplete="current-password" required><button type="button" class="icon-btn" id="eye" data-i18n-aria="waiter-login.show" data-icon="eye" aria-label="Show password"></button></div></div>
    <p class="field-error" id="err" role="alert" hidden></p>
    <button class="btn btn--primary btn--lg btn--block" type="submit"><span data-i18n="waiter-login.go">Sign in</span></button>
    <p class="proto-note" data-i18n="waiter-login.demo">Demo: ravi / Waiter@123</p>
    <div data-lang-mount></div>
  </form></section>
</main>
  <script>window.addEventListener("error",function(e){if(document.getElementById("bbc-err"))return;var d=document.createElement("div");d.id="bbc-err";d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px";d.textContent="Something failed to load: "+(e.message||(e.target&&(e.target.src||e.target.href))||"unknown")+" - open the site through a web address (see README) or tell the developer this message.";document.body.appendChild(d)},true)</script>  <noscript><p style="padding:2rem;font-family:sans-serif">Please turn on JavaScript to use this site.</p></noscript>
</body>
</html>
