<!doctype html>
<html lang="en" data-title-key="parcel.meta.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order a parcel | Billy Belly Chicken</title>
  <meta name="description" content="Waiting for a table or heading out? Order your parcel from Billy Belly Chicken and get a token number.">
  <meta name="theme-color" content="#0a0909">
  
  <meta property="og:title" content="Order a parcel | Billy Belly Chicken"><meta property="og:description" content="Waiting for a table or heading out? Order your parcel from Billy Belly Chicken and get a token number."><meta property="og:type" content="website"><meta property="og:image" content="assets/images/misc/og.svg">
  <link rel="icon" href="assets/logo/favicon.ico"><link rel="apple-touch-icon" href="assets/logo/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/menu-browser.css">
  <link rel="stylesheet" href="css/pages/order.css">
  <link rel="stylesheet" href="css/pages/parcel.css">
  
  <link rel="preload" href="assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="js/bundles/data.js"></script><script defer src="js/bundles/parcel.js"></script>
</head>
<body data-root="" data-page="parcel">
<div class="nav-ph" id="nav-ph" aria-hidden="true"><img src="assets/logo/logo-mark-160.png" alt="" width="40" height="40"></div>
  <main id="main" class="order parcel">
    <section class="banner dark"><div class="order-head container">
      <div class="order-head__row">
        <div>
          <span class="eyebrow" data-i18n="parcel.eyebrow">Waiting area</span>
          <h1 class="display display--xl order-head__title" data-i18n="parcel.title">Parcel, please</h1>
          <p class="text-muted" data-i18n="parcel.lead">Pick your dishes, tell us your name and number, and collect with your token.</p>
        </div>
        <div class="order-head__note card card--glass"><i data-icon="shield"></i><p data-i18n="parcel.how">No payment here. A waiter confirms your order with you, tells the chef, and you pay at the counter when you collect.</p></div>
      </div>
    </div></section>
    <section class="container order-state" id="state" hidden></section>
    <section class="container parcel-live" id="live" hidden></section>
    <div id="view-menu" class="container order-view"><div id="menu-root"></div></div>
  </main>
  <div class="cartbar" id="cartbar" hidden>
    <button type="button" class="cartbar__btn btn btn--primary btn--lg" id="open-cart" data-magnetic>
      <span class="cartbar__ico"><i data-icon="cart"></i><b class="cart-badge" id="cart-count">0</b></span>
      <span class="cartbar__txt" data-i18n="order.viewCart">View cart</span>
      <span class="cartbar__total" id="cart-total"></span>
    </button>
  </div>
  <script>window.addEventListener("error",function(e){if(document.getElementById("bbc-err"))return;var d=document.createElement("div");d.id="bbc-err";d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px";d.textContent="Something failed to load: "+(e.message||(e.target&&(e.target.src||e.target.href))||"unknown")+" - open the site through a web address (see README) or tell the developer this message.";document.body.appendChild(d)},true)</script>  <noscript><p style="padding:2rem;font-family:sans-serif">Please turn on JavaScript to use this site.</p></noscript>
</body>
</html>
