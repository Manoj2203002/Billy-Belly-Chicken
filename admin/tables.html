<!doctype html>
<html lang="en" data-title-key="admin-tables.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tables & QR | Admin | Billy Belly Chicken</title>
  <meta name="description" content="Admin portal">
  <meta name="theme-color" content="#0a0909">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/logo/favicon.ico"><link rel="apple-touch-icon" href="../assets/logo/icon-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/bundles/admin-tables.css" data-src="fonts,variables,base,components,portal,pages/admin-tables">
  <link rel="preload" href="../assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="../js/bundles/data.js"></script><script defer src="../js/bundles/admin-tables.js"></script>
</head>
<body data-root="../" data-page="tables">
<main id="app" class="page"><div class="page-head"><div><h1 data-i18n="admin-tables.h1">Tables and QR codes</h1><p data-i18n="admin-tables.lead">Add tables, assign waiters, print QR codes for the tables, waiting area and reviews.</p></div>
<div class="tabs2" role="tablist" aria-label="Sections"><button class="tabs2__b is-on" role="tab" aria-selected="true" data-tab="tables" type="button" data-i18n="admin-tables.tabTables">Tables</button><button class="tabs2__b" role="tab" aria-selected="false" data-tab="qr" type="button" data-i18n="admin-tables.tabQr">QR codes</button></div></div>
<div id="crud" data-panel="tables"></div>
<section class="qr-sec" data-panel="qr" hidden>
<ul class="qr-stats" id="qr-stats"></ul>
<div class="qr-pub">
  <div class="qr-pub__head"><span class="qr-pub__ico" id="pub-ico"></span><div><h2 data-i18n="admin-tables.pubTitle">Where do the QR codes open?</h2><p data-i18n="admin-tables.pubLead">Every QR code opens this address on the guest's phone.</p></div><span class="qr-pub__state" id="pub-state"></span></div>
  <div class="qr-pub__row"><input class="input" id="base" type="url" aria-label="Website address used in QR codes" placeholder="https://manoj2203002.github.io/Billy-Belly-Chicken" inputmode="url" autocomplete="off"><button class="btn btn--primary" id="base-save" type="button" data-i18n="admin-tables.saveBase">Save address</button></div>
  <div class="qr-pub__ex"><small data-i18n="admin-tables.example">Example link</small><code id="qr-example"></code><a class="btn btn--ghost btn--sm" id="qr-test" href="#" target="_blank" rel="noopener" data-i18n="admin-tables.test">Test link</a></div>
  <div class="qr-pub__foot"><button class="btn btn--ghost" id="print" type="button" data-icon="print"><span data-i18n="admin-tables.print">Print all QR codes</span></button><button class="btn btn--quiet" id="base-site" type="button" data-i18n="admin-tables.useSite">Use this site's address</button></div>
</div>
<div id="qr-groups"></div></section></main>
  <script>window.addEventListener("error",function(e){if(document.getElementById("bbc-err"))return;if(e.target&&e.target.tagName&&e.target.tagName!=="SCRIPT")return;var d=document.createElement("div");d.id="bbc-err";d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px";d.textContent="Something failed to load: "+(e.message||(e.target&&(e.target.src||e.target.href))||"unknown")+" - open the site through a web address (see README) or tell the developer this message.";document.body.appendChild(d)},true)</script>  <noscript><p style="padding:2rem;font-family:sans-serif">Please turn on JavaScript to use this site.</p></noscript>
</body>
</html>
