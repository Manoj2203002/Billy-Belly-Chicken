  <meta name="description" content="Admin portal">

  <meta name="robots" content="noindex">

<body data-root="../" data-page="tables">
<main id="app" class="page"><div class="page-head"><div><h1 data-i18n="admin-tables.h1">Tables and QR codes</h1><p data-i18n="admin-tables.lead">Add tables, assign waiters, print QR codes for the tables, waiting area and reviews.</p></div></div><div id="crud"></div>
<section class="qr-sec"><div class="qr-head"><h2 class="h2" data-i18n="admin-tables.qr">QR codes</h2><p class="text-muted" data-i18n="admin-tables.qrLead">Customers scan these. Print them and place on the tables.</p></div>
<div class="qr-bar"><div class="field"><label class="field__label" for="base" data-i18n="admin-tables.base">Website address used in QR codes</label><input class="input" id="base" type="url" placeholder="https://billybellychicken.in"><div class="field__hint" data-i18n="admin-tables.baseHint">Leave empty to use this site's own address. Set your live domain before printing.</div></div><button class="btn btn--primary" id="base-save" type="button" data-i18n="admin-tables.saveBase">Save address</button><button class="btn btn--ghost" id="print" type="button" data-icon="print"><span data-i18n="admin-tables.print">Print all QR codes</span></button></div>
<div class="qr-grid" id="qr-grid"></div></section></main>
  <script>window.addEventListener("error",function(e){if(document.getElementById("bbc-err"))return;var d=document.createElement("div");d.id="bbc-err";d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px";d.textContent="Something failed to load: "+(e.message||(e.target&&(e.target.src||e.target.href))||"unknown")+" - open the site through a web address (see README) or tell the developer this message.";document.body.appendChild(d)},true)</script>  <noscript><p style="padding:2rem;font-family:sans-serif">Please turn on JavaScript to use this site.</p></noscript>
