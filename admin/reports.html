<body data-root="../" data-page="reports">
<main id="app" class="page"><div class="page-head"><div><h1 data-i18n="admin-reports.h1">Reports</h1><p data-i18n="admin-reports.lead">Sales and popular dishes for any period. Export to CSV.</p></div><button class="btn btn--ghost" id="exp" type="button" data-icon="download"><span data-i18n="admin-reports.export">Export CSV</span></button></div>
<div class="ar-bar"><div class="tabs" id="rng" role="tablist"><button class="tab is-active" data-r="7" data-i18n="admin-reports.d7">7 days</button><button class="tab" data-r="30" data-i18n="admin-reports.d30">30 days</button><button class="tab" data-r="all" data-i18n="admin-reports.all">All time</button><button class="tab" data-r="custom" data-i18n="admin-reports.custom">Custom</button></div>
<div class="ar-custom" id="cust" hidden><input class="input" type="date" id="df" data-i18n-aria="admin-common.from" aria-label="From"><input class="input" type="date" id="dt" data-i18n-aria="admin-common.to" aria-label="To"></div></div>
<section class="stat-grid" id="kpi"></section>
<div class="ar-grid"><section class="card"><h2 class="h3" data-i18n="admin-reports.daily">Daily sales</h2><div id="c-day"></div></section><section class="card"><h2 class="h3" data-i18n="admin-reports.cat">Sales by category</h2><div id="c-cat"></div></section>
<section class="card ar-wide"><div class="ar-h"><h2 class="h3" data-i18n="admin-reports.top">Best sellers</h2><button class="btn btn--ghost btn--sm" id="exp2" type="button" data-icon="download"><span data-i18n="admin-reports.exportItems">Export dishes CSV</span></button></div><div class="table-wrap" id="top"></div></section></div></main>
  <script>window.addEventListener("error",function(e){if(document.getElementById("bbc-err"))return;var d=document.createElement("div");d.id="bbc-err";d.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:14px/1.4 sans-serif;padding:10px 14px";d.textContent="Something failed to load: "+(e.message||(e.target&&(e.target.src||e.target.href))||"unknown")+" - open the site through a web address (see README) or tell the developer this message.";document.body.appendChild(d)},true)</script>  <noscript><p style="padding:2rem;font-family:sans-serif">Please turn on JavaScript to use this site.</p></noscript>
